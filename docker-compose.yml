services:

  kafka:
    image: apache/kafka:latest

    container_name: clickstream-kafka

    # Comes back after a Docker daemon restart or host reboot (consumer
    # and sink already restart on failure; without this the broker stayed
    # down and they retried forever). Only an explicit stop keeps it down.
    restart: unless-stopped

    ports:
      # Only the host listener is published. Port 9092 is deliberately
      # NOT exposed: it advertises kafka:9092, a name the host cannot
      # resolve, so connecting to it from the host fails after the
      # initial handshake.
      - "29092:29092"

    environment:

      # Kafka node
      KAFKA_NODE_ID: 1

      # Run as broker + controller
      KAFKA_PROCESS_ROLES: broker,controller

      # Kafka listeners
      #
      # Two data listeners, one per network vantage point:
      #   PLAINTEXT      :9092  - reached from inside the compose network
      #   PLAINTEXT_HOST :29092 - reached from the host machine
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093

      # What each listener tells clients to come back on.
      #
      # This is the address the client actually dials for produce and
      # fetch - the bootstrap connection only serves metadata. So each
      # listener must advertise a name that resolves FROM THE CLIENT'S
      # OWN NETWORK:
      #   containers resolve kafka:9092 via compose DNS
      #   the host resolves localhost:29092 via the published port above
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092

      # Controller configuration
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listener security
      #
      # A listener name is only a label; this map is what tells Kafka
      # which protocol to speak on it. Every name used above must appear
      # here or the broker refuses to start.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # Broker communication
      #
      # Stays on PLAINTEXT: broker-to-broker traffic is internal to the
      # compose network and must not be routed back out via the host.
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Single broker settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # One partition
      KAFKA_NUM_PARTITIONS: 1

      # Data directory
      #
      # The image defaults to /tmp/kraft-combined-logs, inside the
      # container, so "down" used to delete every topic and committed
      # offset. /var/lib/kafka/data already exists in the image, owned
      # by the non-root kafka user; a named volume mounted there copies
      # that ownership, so the broker can write to it. It holds the KRaft
      # metadata as well as the topic logs.
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    # Healthy = the broker answers an API-versions request on the
    # in-network listener, i.e. clients can actually bootstrap. An open
    # port alone is not enough: the JVM listens before the broker has
    # registered with the KRaft controller.
    #
    # start_period covers JVM + KRaft startup; failures inside it do not
    # count against retries.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s


  # The storefront (via app.py on the host) is the only event producer.

  consumer:
    # build: makes "docker compose build" (and "up --build") rebuild from
    # the code on disk; without it the container can silently run a stale
    # image. image: still names the result, so the tag stays consistent.
    build:
      context: .
      dockerfile: Dockerfile.consumer

    image: clickstream-consumer:latest

    container_name: clickstream-consumer

    # A tiny init (tini) runs as PID 1 and forwards signals. Python as
    # PID 1 ignores SIGTERM until a handler is installed, so a stop during
    # the startup wait for kafka used to sit out the whole grace period.
    init: true

    # Start only once kafka's healthcheck passes. This orders "up"; the
    # retry loop in config.connect_with_retry() covers everything else
    # (a manual restart, kafka bouncing while this container lives).
    depends_on:
      kafka:
        condition: service_healthy

    restart: on-failure

    environment:
      # Set explicitly, NOT read from .env: a container reaches the
      # broker over the compose network, where the correct address is
      # kafka:9092. The .env file carries the host address instead, for
      # processes you run by hand.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # The topic name IS the same everywhere, so this one can come from
      # .env via compose's automatic variable substitution.
      KAFKA_TOPIC: ${KAFKA_TOPIC:-clickstream-json}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-clickstream-json-dlq}


  sink:
    build:
      context: .
      dockerfile: Dockerfile.sink

    image: clickstream-sink:latest

    container_name: clickstream-sink

    # See consumer. tini forwards SIGTERM to sink.py, whose handler still
    # flushes and commits on "down".
    init: true

    depends_on:
      kafka:
        condition: service_healthy

    restart: on-failure

    # "down" sends SIGTERM; sink.py flushes its buffer and commits
    # before exiting. The default 10s is enough, this is headroom.
    stop_grace_period: 30s

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-clickstream-json}

    # Run as the host user that owns the project, not root, so Parquet
    # files in the bind mount belong to that user and can be copied off
    # without sudo. 1000:1000 is ec2-user on Amazon Linux (check with
    # "id ec2-user"); override with SINK_UID / SINK_GID in .env.
    #
    # The host directory must exist and be owned by that user BEFORE the
    # first "up" - if Docker has to create it, it creates it as root and
    # the sink cannot write.
    user: "${SINK_UID:-1000}:${SINK_GID:-1000}"

    # Bind mount: Parquet files land in ./data/bronze on the host and
    # survive the container. data/ is gitignored and dockerignored.
    volumes:
      - ./data/bronze:/app/data/bronze


# Named volume for the broker's data: survives "docker compose down".
# Only "docker compose down -v" (or "docker volume rm") deletes it.

volumes:
  kafka-data: