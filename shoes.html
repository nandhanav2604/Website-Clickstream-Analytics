<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1B1916"
    >

    <title>SoleStream | Shop</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="shop-page">


    <!-- NAVBAR -->

    <header class="navbar">

        <a
            class="logo"
            href="shoes.html"
        >

            Sole<span>Stream</span>

        </a>


        <nav class="nav-links">

            <a href="shoes.html">

                Shop

            </a>


            <a
                class="nav-secondary"
                href="index.html"
            >

                Switch shopper

            </a>


            <button
                type="button"
                class="cart-nav-button"
                onclick="openCart()"
                aria-label="Open cart"
            >

                <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M6 7h12l-1.2 11.1a2 2 0 0 1-2 1.9H9.2a2 2 0 0 1-2-1.9L6 7Z" />
                    <path d="M9 7a3 3 0 0 1 6 0" />
                </svg>

                <span class="cart-nav-label">

                    Cart

                </span>

                <span
                    id="cartCount"
                    class="cart-badge"
                >0</span>

            </button>

        </nav>

    </header>


    <!-- WELCOME -->

    <section class="shop-header">

        <p class="eyebrow">

            Hi,
            <span id="welcomeName">Shopper</span>

        </p>


        <h1>

            The everyday rotation

        </h1>


        <p
            id="userDetails"
            class="shopper-details"
        >

            Explore shoes and find your perfect pair.

        </p>

    </section>


    <!-- FILTERS -->

    <section
        class="filters-section"
        aria-label="Filter shoes"
    >

        <div class="filters">


            <!-- BRAND -->

            <label class="filter-pill">

                <span class="filter-label">Brand</span>

                <select id="brandFilter">

                    <option value="all">
                        All
                    </option>

                    <option value="Nike">
                        Nike
                    </option>

                    <option value="Adidas">
                        Adidas
                    </option>

                    <option value="Puma">
                        Puma
                    </option>

                    <option value="New Balance">
                        New Balance
                    </option>

                </select>

            </label>


            <!-- CATEGORY -->

            <label class="filter-pill">

                <span class="filter-label">Category</span>

                <select id="categoryFilter">

                    <option value="all">
                        All
                    </option>

                    <option value="Running">
                        Running
                    </option>

                    <option value="Casual">
                        Casual
                    </option>

                    <option value="Basketball">
                        Basketball
                    </option>

                    <option value="Training">
                        Training
                    </option>

                </select>

            </label>


            <!-- COLOUR -->

            <label class="filter-pill">

                <span class="filter-label">Colour</span>

                <select id="colourFilter">

                    <option value="all">
                        All
                    </option>

                    <option value="Black">
                        Black
                    </option>

                    <option value="White">
                        White
                    </option>

                    <option value="Red">
                        Red
                    </option>

                    <option value="Blue">
                        Blue
                    </option>

                </select>

            </label>


            <!-- PRICE -->

            <label class="filter-pill">

                <span class="filter-label">Price</span>

                <select id="priceFilter">

                    <option value="all">
                        All
                    </option>

                    <option value="0-3000">
                        Under ₹3,000
                    </option>

                    <option value="3000-6000">
                        ₹3,000 – ₹6,000
                    </option>

                    <option value="6000+">
                        Over ₹6,000
                    </option>

                </select>

            </label>


            <button
                type="button"
                class="clear-filter"
                onclick="clearFilters()"
                disabled
            >

                Clear all

            </button>

        </div>


        <p
            id="productCount"
            class="product-count"
            aria-live="polite"
        >

            Loading shoes…

        </p>

    </section>


    <!-- PRODUCTS -->
    <!-- The skeleton cards are the loading state; displayProducts() replaces them. -->

    <main class="products-section">

        <div
            id="productContainer"
            class="product-grid"
            aria-busy="true"
        >

            <div class="product-card skeleton" aria-hidden="true"></div>
            <div class="product-card skeleton" aria-hidden="true"></div>
            <div class="product-card skeleton" aria-hidden="true"></div>
            <div class="product-card skeleton" aria-hidden="true"></div>

        </div>

    </main>


    <!-- CART DRAWER -->

    <div
        class="drawer-scrim"
        onclick="closeCart()"
    ></div>


    <aside
        id="cart"
        class="cart-drawer"
        aria-label="Your cart"
        inert
    >

        <div class="drawer-header">

            <h2>

                Your cart

            </h2>


            <button
                type="button"
                class="icon-button"
                onclick="closeCart()"
                aria-label="Close cart"
            >

                <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>

            </button>

        </div>


        <div
            id="cartItems"
            class="cart-items"
        >

            Your cart is empty.

        </div>


        <div class="cart-summary">

            <div class="summary-row">

                <span>Subtotal</span>

                <span id="cartTotal">₹0</span>

            </div>


            <p class="summary-note">

                Free delivery · 7-day returns

            </p>


            <button
                type="button"
                id="checkoutButton"
                class="buy-button"
                onclick="openCheckout('cart')"
            >

                Checkout

            </button>

        </div>

    </aside>


    <!-- CHECKOUT (review, then confirm) -->

    <dialog
        id="checkoutDialog"
        class="checkout-dialog"
        aria-labelledby="checkoutTitle"
    >

        <div id="checkoutBody"></div>

    </dialog>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
        role="status"
        aria-live="polite"
    ></div>


    <script src="script.js"></script>


</body>

</html>
