<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SoleStream | Shoe Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">

            SoleStream 👟

        </div>


        <div class="nav-links">

            <a href="index.html">

                Change User

            </a>


            <a href="shoes.html">

                Shop

            </a>


            <button
                class="cart-nav-button"
                onclick="scrollToCart()"
            >

                🛒 View Cart
                (
                <span id="cartCount">
                    0
                </span>
                )

            </button>

        </div>

    </nav>


    <!-- WELCOME -->

    <section class="shop-header">

        <h1>

            Welcome,

            <span id="welcomeName">

                Shopper

            </span>

            !

        </h1>


        <p id="userDetails">

            Explore shoes and find your perfect pair.

        </p>

    </section>


    <!-- FILTERS -->

    <section class="filters-section">

        <h2>
            Find Your Shoes
        </h2>


        <div class="filters">


            <!-- BRAND -->

            <select id="brandFilter">

                <option value="all">
                    All Brands
                </option>

                <option value="Nike">
                    Nike
                </option>

                <option value="Adidas">
                    Adidas
                </option>

                <option value="Puma">
                    Puma
                </option>

                <option value="New Balance">
                    New Balance
                </option>

            </select>


            <!-- CATEGORY -->

            <select id="categoryFilter">

                <option value="all">
                    All Categories
                </option>

                <option value="Running">
                    Running
                </option>

                <option value="Casual">
                    Casual
                </option>

                <option value="Basketball">
                    Basketball
                </option>

                <option value="Training">
                    Training
                </option>

            </select>


            <!-- COLOUR -->

            <select id="colourFilter">

                <option value="all">
                    All Colours
                </option>

                <option value="Black">
                    Black
                </option>

                <option value="White">
                    White
                </option>

                <option value="Red">
                    Red
                </option>

                <option value="Blue">
                    Blue
                </option>

            </select>


            <!-- PRICE -->

            <select id="priceFilter">

                <option value="all">
                    All Prices
                </option>

                <option value="0-3000">
                    Under ₹3000
                </option>

                <option value="3000-6000">
                    ₹3000 - ₹6000
                </option>

                <option value="6000+">
                    Above ₹6000
                </option>

            </select>


            <button
                class="clear-filter"
                onclick="clearFilters()"
            >

                Clear Filters

            </button>

        </div>


        <p
            id="productCount"
            class="product-count"
        ></p>

    </section>


    <!-- PRODUCTS -->

    <section class="products-section">

        <div
            id="productContainer"
            class="product-grid"
        ></div>

    </section>


    <!-- CART -->

    <section
        id="cart"
        class="cart-section"
    >

        <h2>
            🛒 Your Cart
        </h2>


        <div id="cartItems">

            Your cart is empty.

        </div>


        <div class="cart-summary">

            <h3>

                Total:

                ₹
                <span id="cartTotal">
                    0
                </span>

            </h3>


            <button
                class="buy-button"
                onclick="buyCart()"
            >

                Buy Now

            </button>


            <div
                id="orderMessage"
                class="order-message"
            ></div>

        </div>

    </section>


    <script src="script.js"></script>


</body>

</html>
